name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ['staging'] # Dispara quando houver push na branch staging
    paths:
      - 'frontend/**'      # Roda a Action apenas se houver alterações dentro da pasta frontend

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json' # Aponta para o lockfile na subpasta

      - name: Install dependencies
        working-directory: ./frontend                      # Executa npm ci dentro de frontend/
        run: npm ci

      - name: Build project
        working-directory: ./frontend                      # Executa npm run build dentro de frontend/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/build'                          # Aponta para a pasta de build gerada dentro de frontend/ (mude para ./frontend/build se usar CRA)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4